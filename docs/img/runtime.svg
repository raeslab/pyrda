<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 664 344" width="664" height="344" role="img"><title>Run time of the full workflow by number of samples</title><style>
.bg { fill: #fcfcfb; }
.grid, .rowline { stroke: #e3e5e1; stroke-width: 1; }
.axis { stroke: #c3c6c0; stroke-width: 1; }
.tick { fill: #7b8387; font-family: 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 11px; }
.rowlabel, .axlabel, .legend { fill: #4b5357; font-family: Archivo, 'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; }
.panel { fill: #15191c; font-family: Archivo, 'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
.endlabel { fill: #15191c; font-family: Archivo, 'Arial Narrow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; }
.identity { stroke: #7b8387; stroke-width: 1; }
.limit { stroke: #4b5357; stroke-width: 1; }
.band { fill: #2a78d6; fill-opacity: 0.11; stroke: none; }
.dot { stroke: #fcfcfb; stroke-width: 1.5; }
.ring { stroke-width: 2; }
.line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.key { stroke-width: 2; }
.s-old .dot { fill-opacity: 0.85; }
.s-new .dot { fill: #2a78d6; }
.line.s-new, .key.s-new { stroke: #2a78d6; }
.warned.s-new .dot { fill: #fcfcfb; stroke: #2a78d6; stroke-width: 2; }
.s-old .dot { fill: #eb6834; }
.line.s-old, .key.s-old { stroke: #eb6834; }
.warned.s-old .dot { fill: #fcfcfb; stroke: #eb6834; stroke-width: 2; }
.s-an .dot { fill: #1baf7a; }
.line.s-an, .key.s-an { stroke: #1baf7a; }
.warned.s-an .dot { fill: #fcfcfb; stroke: #1baf7a; stroke-width: 2; }
.s-par .dot { fill: #eda100; }
.line.s-par, .key.s-par { stroke: #eda100; }
.warned.s-par .dot { fill: #fcfcfb; stroke: #eda100; stroke-width: 2; }
.s-R .dot { fill: #52514e; }
.line.s-R, .key.s-R { stroke: #52514e; }
.warned.s-R .dot { fill: #fcfcfb; stroke: #52514e; stroke-width: 2; }
