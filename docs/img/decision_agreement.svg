<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 664 406" width="664" height="406" role="img"><title>How often each test reproduces R&#x27;s significant variables and selection</title><style>
.bg { fill: #fcfcfb; }
.grid, .rowline { stroke: #e3e5e1; stroke-width: 1; }
.axis { stroke: #c3c6c0; stroke-width: 1; }
